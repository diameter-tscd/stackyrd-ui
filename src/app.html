<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link rel="stylesheet" href="https://fonts.cdnfonts.com/css/product-sans" media="print" onload="this.media='all'" />
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'" />
		<noscript><link rel="stylesheet" href="https://fonts.cdnfonts.com/css/product-sans" /><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" /></noscript>
		<script>
			(function() {
				try {
					var t = localStorage.getItem('stackyrd_theme');
					if (t === 'light' || t === 'dark' || t === 'night') {
						document.documentElement.classList.remove('light','dark','night');
						document.documentElement.classList.add(t);
						document.documentElement.style.colorScheme = t === 'light' ? 'light' : 'dark';
					} else {
						document.documentElement.classList.add('light');
						document.documentElement.style.colorScheme = 'light';
					}
					if (localStorage.getItem('stackyrd_disable_animation') === 'true') {
						document.documentElement.setAttribute('data-disable-anim', 'true');
					}
				} catch(e) {
					document.documentElement.classList.add('light');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="tap" class="min-h-screen">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
